<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Cadena de bloques simple">
  <g font-family="Arial, sans-serif">
    <rect x="40" y="80" width="220" height="160" rx="12" fill="#0b1f3a"/>
    <text x="150" y="140" font-size="24" font-weight="bold" fill="#fbbf24" text-anchor="middle">Bloque 1</text>
    <text x="150" y="175" font-size="16" fill="#cbd5e1" text-anchor="middle">Hash: 0x4d2a…</text>
    <text x="150" y="205" font-size="16" fill="#cbd5e1" text-anchor="middle">Anterior: Genesis</text>
    <rect x="340" y="80" width="220" height="160" rx="12" fill="#1e3a5f" stroke="#fbbf24" stroke-width="2"/>
    <text x="450" y="140" font-size="24" font-weight="bold" fill="#fbbf24" text-anchor="middle">Bloque 2</text>
    <text x="450" y="175" font-size="16" fill="#cbd5e1" text-anchor="middle">Hash: 0x9ec1…</text>
