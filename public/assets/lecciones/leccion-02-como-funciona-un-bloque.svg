<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Estructura de un bloque">
  <g font-family="Arial, sans-serif">
    <rect x="60" y="40" width="360" height="340" rx="14" fill="#0b1f3a"/>
    <rect x="80" y="70" width="320" height="48" rx="8" fill="#1e3a5f"/>
    <text x="240" y="100" font-size="18" fill="#fbbf24" text-anchor="middle">Hash del bloque anterior</text>
    <rect x="80" y="140" width="320" height="130" rx="8" fill="#1e3a5f"/>
