name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Web3Forms (misma cuenta de Servicios APC que ya usa el sistema).
          # Si falta el endpoint o la key, el kit se descarga directo
          # (ver app/lib/leads.ts).
          VITE_LEADS_ENDPOINT: ${{ secrets.VITE_LEADS_ENDPOINT }}
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
      - name: Guardar noticias para Telegram
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: telegram-news
          path: public/data/news.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  telegram-news:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: telegram-news
          path: telegram-news
      - name: Enviar reporte diario al grupo
        env:
          NEWS_BOT_TOKEN: ${{ secrets.NEWS_BOT_TOKEN }}
          NEWS_CHAT_ID: ${{ secrets.NEWS_CHAT_ID }}
        run: node scripts/send-news-report.mjs --file telegram-news/news.json
